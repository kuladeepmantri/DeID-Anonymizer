version: "3.9"

x-common-env: &common-env
  ENV_FILE: .env

services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-01-04T00-00-00Z
    platform: linux/arm64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  createbuckets:
    image: minio/mc:RELEASE.2025-01-04T00-00-00Z
    platform: linux/arm64
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY}); do echo 'Waiting for MinIO...' && sleep 2; done; 
      /usr/bin/mc mb -p local/${S3_BUCKET}; 
      /usr/bin/mc anonymous set download local/${S3_BUCKET}; 
      exit 0;"

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ENABLE_AI_DETECTION=${ENABLE_AI_DETECTION}
      - ENABLE_OCR=${ENABLE_OCR}
      - ENABLE_GRAPHQL=${ENABLE_GRAPHQL}
      - ENABLE_AUDIT_LEDGER=${ENABLE_AUDIT_LEDGER}
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"
    command: ["bash", "-lc", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    env_file:
      - ../.env
    depends_on:
      - backend
      - redis
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    env_file:
      - ../.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    command: ["bash", "-lc", "npm run dev -- --host 0.0.0.0 --port 5173"]

volumes:
  pgdata: {}
  redisdata: {}
  minio: {}